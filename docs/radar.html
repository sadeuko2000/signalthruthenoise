<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#a6abad">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>radarxxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<link rel="stylesheet" href="radar.css">
</head>
<body>
<div id="radar" hidden>
  <header class="head">
    <button id="bpm-open" class="tempo" aria-haspopup="dialog" aria-label="Tempo, otwórz ustawienie">
      <svg viewBox="0 0 16 16" width="22" height="22" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="M9 2h2v9H9z"/><path d="M11 2h3v3h-3z"/><path d="M6 10h4v1h1v2h-1v1H6v-1H5v-2h1z"/></svg>
    </button>
    <nav class="tabs4" id="pages" aria-label="Strony">
      <button data-page="seq" class="on">SEQ</button>
      <button data-page="mix">MIX</button>
      <button data-page="syn">SYN</button>
      <button data-page="fx">FX</button>
    </nav>
    <button id="play" class="play" aria-label="play / stop"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></button>
  </header>

  <main class="stage">
    <section class="scopewrap" id="scopewrap">
      <div class="scopebox">
        <canvas id="scope" aria-label="Ekran radarowy"></canvas>
        <div class="dots" id="dots">
          <button class="dot" data-i="0"></button><button class="dot" data-i="1"></button>
          <button class="dot" data-i="2"></button><button class="dot" data-i="3"></button>
        </div>
      </div>
    </section>
    <nav class="subtabs" id="subtabs" aria-label="Zakładki strony"></nav>
    <section class="panel" id="panel"></section>
    <pre id="readout" hidden></pre>
  </main>

  <nav class="bar" id="bar" aria-label="Pasek narzędzi">
    <div class="grp"><button id="undo" aria-label="Cofnij">UNDO</button><button id="redo" aria-label="Ponów">REDO</button></div>
    <button id="rec" class="rec" aria-label="Nagrywanie (w przygotowaniu)"></button>
    <div class="grp"><button id="save" aria-label="Zapisz preset">SAVE</button><button id="menu-open" aria-label="Menu">MENU</button></div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="bpm-pop" class="pop" hidden role="dialog" aria-label="Tempo">
    <div class="popcard">
      <div class="poplabel">TEMPO</div>
      <div class="popval"><b id="bpm-v">130</b><span>BPM</span></div>
      <div class="poprow">
        <button id="bpm-5" aria-label="o 5 wolniej">−5</button>
        <button id="bpm-" aria-label="wolniej">−</button>
        <button id="bpm+" aria-label="szybciej">+</button>
        <button id="bpm+5" aria-label="o 5 szybciej">+5</button>
      </div>
      <button id="bpm-ok" class="popok">OK</button>
    </div>
  </div>
  <div id="ctl-pop" class="pop" hidden role="dialog" aria-label="Kontrolery">
    <div class="popcard menucard">
      <div class="poplabel" id="ctl-title">KONTROLERY</div>
      <div id="ctl-body" class="menubody ctlbody"></div>
      <button id="ctl-ok" class="popok">GOTOWE</button>
    </div>
  </div>
  <div id="menu-pop" class="pop" hidden role="dialog" aria-label="Menu">
    <div class="popcard menucard">
      <div class="poplabel">MENU</div>
      <div id="menu-body" class="menubody"></div>
      <button id="menu-ok" class="popok">ZAMKNIJ</button>
    </div>
  </div>
</div>

<div id="start">
  <div class="sweepdemo" aria-hidden="true"></div>
  <button id="go">START</button>
  <p>słuchawki polecane</p>
</div>
<script type="module" src="js/radar.js"></script>
</body>
</html>
