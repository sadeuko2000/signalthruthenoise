<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#a6abad">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>radarxxx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<link rel="stylesheet" href="radar.css">
</head>
<body>
<div id="radar" hidden>
  <header class="head">
    <button id="bpm-open" class="tempo" aria-haspopup="dialog" aria-label="Tempo, otwórz ustawienie">
      <svg viewBox="0 0 16 16" width="22" height="22" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="M9 2h2v9H9z"/><path d="M11 2h3v3h-3z"/><path d="M6 10h4v1h1v2h-1v1H6v-1H5v-2h1z"/></svg>
    </button>
    <nav class="tabs4" id="pages" aria-label="Strony">
      <button data-page="seq" class="on">SEQ</button>
      <button data-page="mix">MIX</button>
      <button data-page="syn">SYN</button>
      <button data-page="fx">FX</button>
    </nav>
    <button id="play" class="play" aria-label="play / stop">▶</button>
  </header>

  <main class="stage">
    <section class="scopewrap" id="scopewrap"><canvas id="scope" aria-label="Ekran radarowy"></canvas></section>
    <aside class="side" id="side">
      <pre id="readout" aria-live="off"></pre>
      <section class="knobrow" id="knobs-seq">
        <div class="knob" id="gate" data-label="GATE" data-min="0.4" data-max="1.6" data-step="0.01" data-value="1" data-fmt="x"></div>
        <div class="knob" id="swing" data-label="SWING" data-min="0" data-max="0.4" data-step="0.01" data-value="0" data-fmt="pct"></div>
        <div class="knob" id="accent" data-label="ACCENT" data-min="0" data-max="1" data-step="0.01" data-value="0.5" data-fmt="pct"></div>
        <div class="knob" id="slide" data-label="SLIDE" data-min="0" data-max="1" data-step="0.01" data-value="0.1" data-fmt="pct"></div>
      </section>
      <section class="knobrow" id="knobs-mix" hidden>
        <div class="knob" id="lv0" data-label="PROPHET" data-min="0" data-max="1.5" data-step="0.01" data-value="1" data-fmt="pct"></div>
        <div class="knob" id="lv1" data-label="MS-20" data-min="0" data-max="1.5" data-step="0.01" data-value="1" data-fmt="pct"></div>
        <div class="knob" id="lv2" data-label="DX" data-min="0" data-max="1.5" data-step="0.01" data-value="1" data-fmt="pct"></div>
        <div class="knob" id="lv3" data-label="WAVETBL" data-min="0" data-max="1.5" data-step="0.01" data-value="1" data-fmt="pct"></div>
      </section>
    </aside>
    <section id="synpage" hidden><div class="kgrid" id="syngrid"></div></section>
    <section id="fxpage" hidden></section>
    <div id="synstatic" hidden>
      <div class="knob" id="cutoff" data-label="CUTOFF" data-min="0" data-max="1" data-step="0.001" data-value="0.5" data-fmt="pct"></div>
      <div class="knob" id="reso" data-label="RESO" data-min="0" data-max="1" data-step="0.01" data-value="0.5" data-fmt="pct"></div>
    </div>
  </main>

  <nav class="softkeys" id="softkeys" aria-label="Przyciski kontekstowe"></nav>
  <span class="cornerl" aria-hidden="true">RDX R 001</span><span class="cornerr" aria-hidden="true">PIXEL RADAR</span>

  <div id="bpm-pop" class="pop" hidden role="dialog" aria-label="Tempo">
    <div class="popcard">
      <div class="poplabel">TEMPO</div>
      <div class="popval"><b id="bpm-v">130</b><span>BPM</span></div>
      <div class="poprow">
        <button id="bpm-5" aria-label="o 5 wolniej">−5</button>
        <button id="bpm-" aria-label="wolniej">−</button>
        <button id="bpm+" aria-label="szybciej">+</button>
        <button id="bpm+5" aria-label="o 5 szybciej">+5</button>
      </div>
      <button id="bpm-ok" class="popok">OK</button>
    </div>
  </div>
  <div id="key-pop" class="pop" hidden role="dialog" aria-label="Nuta bazowa i skala">
    <div class="popcard">
      <div class="poplabel">BASE / KEY</div>
      <div class="keyrow"><span>BASE</span><button id="kp-base-" aria-label="półton niżej">−</button><b id="kp-base">C2</b><button id="kp-base+" aria-label="półton wyżej">+</button></div>
      <div class="keyrow"><span>KEY</span><button id="kp-key-" aria-label="poprzednia skala">−</button><b id="kp-key">ELEKTRO</b><button id="kp-key+" aria-label="następna skala">+</button></div>
      <button id="kp-ok" class="popok">OK</button>
    </div>
  </div>
</div>

<div id="start">
  <div class="sweepdemo" aria-hidden="true"></div>
  <button id="go">START</button>
  <p>słuchawki polecane</p>
</div>
<script type="module" src="js/radar.js"></script>
</body>
</html>
