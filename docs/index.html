<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b10">
<title>Signal Thru the Noise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" hidden>
  <header>
    <h1>signal<span>thru</span>noise</h1>
    <div class="bpm"><button id="bpm-" aria-label="wolniej">−</button><b id="bpm">130</b><button id="bpm+" aria-label="szybciej">+</button></div>
  </header>

  <section id="grid" aria-label="Sekwencer 16 kroków"></section>

  <section id="pad" aria-label="Pad XY: filtr i gęstość">
    <span class="ax ax-x">filtr →</span>
    <span class="ax ax-y">↑ gęstość</span>
    <i id="dot"></i>
  </section>

  <section class="knobs">
    <label>synkopa<input id="sync" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>rezonans<input id="reso" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  </section>

  <section id="voc" hidden>
    <label>czułość głosu<input id="sens" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <div id="meter" aria-label="poziom mikrofonu"><i></i></div>
    <p>Użyj słuchawek, inaczej głośnik wróci do mikrofonu. Mów lub nuć do mikrofonu.</p>
  </section>

  <section class="actions">
    <button id="play" class="big">▶</button>
    <button id="dice" class="big accent">🎲 losuj</button>
    <button id="mut" class="big">✦ mutuj</button>
  </section>
  <section class="toggles">
    <button id="mode" class="chip">moll</button>
    <button id="kick" class="chip on">kick</button>
    <button id="voice" class="chip">głos</button>
    <button id="gyro" class="chip">żyro</button>
    <button id="zero" class="chip" hidden>zeruj</button>
  </section>
</main>

<div id="start">
  <button id="go">Start</button>
  <p>słuchawki polecane</p>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
